<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 자동차 판매 수수료 계산기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --kia-black: #05141f;
            --kia-red: #ea0029;
            --kia-dark-gray: #1e293b;
            --kia-card-bg: #111c24;
            --kia-border: #2a3746;
        }
        body {
            background-color: var(--kia-black);
            color: #f8fafc;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            padding-bottom: 30px;
        }
        .header-bar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid var(--kia-border);
            padding: 18px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .card-custom {
            background-color: var(--kia-card-bg);
            border: 1px solid var(--kia-border);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .form-control, .form-select {
            background-color: #0d151c;
            border: 1px solid var(--kia-border);
            color: #fff;
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0d151c;
            color: #fff;
            border-color: var(--kia-red);
            box-shadow: 0 0 0 0.25rem rgba(234, 0, 41, 0.25);
        }
        .btn-quick {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid var(--kia-border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-quick:hover, .btn-quick:active {
            background-color: var(--kia-red);
            color: #fff;
            border-color: var(--kia-red);
        }
        .result-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 2px solid #6366f1;
            border-radius: 16px;
            padding: 24px;
        }
        .modal-content {
            background-color: var(--kia-card-bg);
            border: 1px solid var(--kia-border);
            color: #fff;
        }
        .table-dark-custom {
            color: #cbd5e1;
        }
        .table-dark-custom th {
            background-color: #0f172a;
            color: #94a3b8;
            border-bottom: 2px solid var(--kia-border);
        }
        .table-dark-custom td {
            border-bottom: 1px solid var(--kia-border);
        }
        .nav-pills .nav-link {
            color: #94a3b8;
            border-radius: 10px;
        }
        .nav-pills .nav-link.active {
            background-color: var(--kia-red);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header-bar text-center">
        <h4 class="m-0 fw-bold tracking-wide"><i class="fa-solid fa-car me-2" style="color:var(--kia-red);"></i>기아 자동차 판매 수수료 계산기</h4>
    </div>

    <div class="container mt-4" style="max-width: 650px;">
        <!-- 차량 및 가격 입력 -->
        <div class="card card-custom p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold m-0 text-light"><i class="fa-solid fa-sliders me-2 text-danger"></i>차종 및 조건 선택</h6>
                <button class="btn btn-sm btn-outline-light rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#tableModal">
                    <i class="fa-solid fa-table me-1"></i> 전차종 요율표
                </button>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small">차량 모델 선택</label>
                <select id="carSelect" class="form-select fw-semibold">
                    <!-- JS로 동적 생성 -->
                </select>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-secondary small mb-0">차량 가격 (원)</label>
                    <span id="koreanPrice" class="small text-warning fw-bold">0원</span>
                </div>
                <input type="text" id="priceInput" class="form-control form-control-lg fw-bold text-end" placeholder="0">
            </div>

            <!-- 빠른 금액 추가 -->
            <div class="d-flex gap-2 mb-3 flex-wrap">
                <button class="btn btn-quick flex-fill" onclick="addPrice(1000000)">+100만</button>
                <button class="btn btn-quick flex-fill" onclick="addPrice(5000000)">+500만</button>
                <button class="btn btn-quick flex-fill" onclick="addPrice(10000000)">+1,000만</button>
                <button class="btn btn-quick flex-fill" onclick="addPrice(30000000)">+3,000만</button>
                <button class="btn btn-quick text-danger" onclick="clearPrice()"><i class="fa-solid fa-rotate-left"></i></button>
            </div>

            <!-- 파라미터 세부정보 -->
            <div class="p-3 rounded-3" style="background-color: #0a1118; border: 1px solid #1e293b;">
                <div class="row g-2 text-center small">
                    <div class="col-4">
                        <span class="text-secondary d-block">부가세계수</span>
                        <span id="paramVat" class="fw-bold text-info">1.1715</span>
                    </div>
                    <div class="col-4">
                        <span class="text-secondary d-block">수수료율</span>
                        <span id="paramRate" class="fw-bold text-info">5.5%</span>
                    </div>
                    <div class="col-4">
                        <span class="text-secondary d-block">지급요율</span>
                        <span id="paramPay" class="fw-bold text-info">70%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 계산 결과 카드 -->
        <div class="result-box mb-4">
            <div class="text-center mb-3">
                <span class="badge bg-danger px-3 py-2 rounded-pill fs-7 mb-2">최종 정산 수수료</span>
                <h1 id="finalCommission" class="display-5 fw-extrabold text-white my-1">0 <span class="fs-4">원</span></h1>
            </div>
            <hr style="border-color: rgba(255,255,255,0.15);">
            <div class="row g-2 text-secondary small pt-1">
                <div class="col-6">공급 가액</div>
                <div class="col-6 text-end text-light fw-semibold" id="supplyPrice">0 원</div>
                <div class="col-6">기본 수수료 (100%)</div>
                <div class="col-6 text-end text-light fw-semibold" id="baseCommission">0 원</div>
            </div>
        </div>
    </div>

    <!-- 전차종 요율표 모달 -->
    <div class="modal fade" id="tableModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-list me-2 text-danger"></i>기아 차종별 수수료 요율표</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <table class="table table-dark-custom align-middle m-0">
                        <thead>
                            <tr>
                                <th class="ps-3">분류</th>
                                <th>차량명</th>
                                <th class="text-center">부가세계수</th>
                                <th class="text-end pe-3">수수료율</th>
                            </tr>
                        </thead>
                        <tbody id="rateTableBody">
                            <!-- JS로 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const carData = [
            { category: '승용', name: '모닝', vat: 1.1000, rate: 0.0750 },
            { category: '승용', name: '레이', vat: 1.1000, rate: 0.0750 },
            { category: '승용', name: 'K5', vat: 1.1715, rate: 0.0600 },
            { category: '승용', name: 'K5 HEV', vat: 1.1715, rate: 0.0600 },
            { category: '승용', name: 'K8', vat: 1.1715, rate: 0.0500 },
            { category: '승용', name: 'K9', vat: 1.1715, rate: 0.0430 },
            { category: '승용', name: 'K9 5.0Q', vat: 1.1715, rate: 0.0400 },
            { category: 'SUV/RV', name: '니로', vat: 1.1715, rate: 0.0600 },
            { category: 'SUV/RV', name: '셀토스', vat: 1.1715, rate: 0.0550 },
            { category: 'SUV/RV', name: '스포티지', vat: 1.1715, rate: 0.0550 },
            { category: 'SUV/RV', name: '쏘렌토', vat: 1.1715, rate: 0.0550 },
            { category: 'SUV/RV', name: '카니발 7인', vat: 1.1715, rate: 0.0600 },
            { category: 'SUV/RV', name: '카니발 9인', vat: 1.1000, rate: 0.0600 },
            { category: 'SUV/RV', name: '카니발 하이4인', vat: 1.1715, rate: 0.0500 },
            { category: 'SUV/RV', name: '1톤', vat: 1.1000, rate: 0.0700 },
            { category: 'SUV/RV', name: '1.2톤', vat: 1.1000, rate: 0.0600 },
            { category: 'SUV/RV', name: '타스만', vat: 1.1715, rate: 0.0550 },
            { category: 'EV', name: '레이 EV 라이트', vat: 1.1715, rate: 0.0480 },
            { category: 'EV', name: '레이 EV 에어', vat: 1.1715, rate: 0.0500 },
            { category: 'EV', name: 'EV3', vat: 1.1715, rate: 0.0420 },
            { category: 'EV', name: 'EV4', vat: 1.1715, rate: 0.0420 },
            { category: 'EV', name: 'EV5', vat: 1.1715, rate: 0.0420 },
            { category: 'EV', name: 'EV6', vat: 1.1715, rate: 0.0330 },
            { category: 'EV', name: 'EV9 에어', vat: 1.1715, rate: 0.0280 },
            { category: 'EV', name: 'EV9 어스', vat: 1.1715, rate: 0.0310 },
            { category: 'EV', name: 'EV9 GT line', vat: 1.1715, rate: 0.0320 },
            { category: 'EV', name: 'EV9 GT', vat: 1.1715, rate: 0.0350 },
            { category: 'EV', name: '봉고EV', vat: 1.1000, rate: 0.0380 },
            { category: 'EV', name: 'PV5', vat: 1.1715, rate: 0.0450 }
        ];

        const carSelect = document.getElementById('carSelect');
        const priceInput = document.getElementById('priceInput');
        const koreanPrice = document.getElementById('koreanPrice');
        const paramVat = document.getElementById('paramVat');
        const paramRate = document.getElementById('paramRate');
        const paramPay = document.getElementById('paramPay');
        const finalCommission = document.getElementById('finalCommission');
        const supplyPrice = document.getElementById('supplyPrice');
        const baseCommission = document.getElementById('baseCommission');
        const rateTableBody = document.getElementById('rateTableBody');

        // Populate Car Select & Modal Table
        function initData() {
            let currentCat = '';
            carData.forEach((car, idx) => {
                // Select Option
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `[${car.category}] ${car.name} (${(car.rate*100).toFixed(1)}%)`;
                carSelect.appendChild(opt);

                // Table Row
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-3 text-secondary small">${car.category}</td>
                    <td class="fw-bold">${car.name}</td>
                    <td class="text-center">${car.vat}</td>
                    <td class="text-end pe-3 text-warning fw-bold">${(car.rate*100).toFixed(1)}%</td>
                `;
                tr.style.cursor = 'pointer';
                tr.onclick = () => {
                    carSelect.value = idx;
                    updateCalc();
                    bootstrap.Modal.getInstance(document.getElementById('tableModal')).hide();
                };
                rateTableBody.appendChild(tr);
            });

            // Default Select: 셀토스 (idx 8)
            carSelect.value = 8;
        }

        function numToKorean(num) {
            if (!num || num <= 0) return '0원';
            const uk = Math.floor(num / 100000000);
            const man = Math.floor((num % 100000000) / 10000);
            let str = '';
            if (uk > 0) str += `${uk}억 `;
            if (man > 0) str += `${man.toLocaleString()}만원`;
            return str || `${num.toLocaleString()}원`;
        }

        function getRawPrice() {
            return parseInt(priceInput.value.replace(/[^0-9]/g, '')) || 0;
        }

        function setPrice(val) {
            priceInput.value = val > 0 ? val.toLocaleString() : '';
            koreanPrice.textContent = numToKorean(val);
            updateCalc();
        }

        function addPrice(amount) {
            const current = getRawPrice();
            setPrice(current + amount);
        }

        function clearPrice() {
            setPrice(0);
        }

        function updateCalc() {
            const car = carData[carSelect.value];
            const price = getRawPrice();
            const payRate = 0.70; // 70%

            paramVat.textContent = car.vat;
            paramRate.textContent = `${(car.rate * 100).toFixed(1)}%`;
            paramPay.textContent = `70%`;

            if (price > 0) {
                const supply = Math.round(price / car.vat);
                const baseComm = Math.round(supply * car.rate);
                const finalComm = Math.round(baseComm * payRate);

                supplyPrice.textContent = `${supply.toLocaleString()} 원`;
                baseCommission.textContent = `${baseComm.toLocaleString()} 원`;
                finalCommission.innerHTML = `${finalComm.toLocaleString()} <span class="fs-4">원</span>`;
            } else {
                supplyPrice.textContent = '0 원';
                baseCommission.textContent = '0 원';
                finalCommission.innerHTML = `0 <span class="fs-4">원</span>`;
            }
        }

        priceInput.addEventListener('input', (e) => {
            const raw = getRawPrice();
            setPrice(raw);
        });

        carSelect.addEventListener('change', updateCalc);

        initData();
        updateCalc();
    </script>
</body>
</html>
